# GENERATED by Scripts/sync-package-ci in the CodeEditor workspace superproject.
# Edit the generator there, not this file: `Scripts/sync-package-ci --check`
# (run by Scripts/verify-all) fails when this file drifts.
name: CI

# Pushes to main run nothing (owner decision, 2026-10-08: commits land on
# main directly and the full suite is heavy). The full suite runs on release
# tags, on pull requests (documentation-only PRs skip, see `paths`), weekly,
# and on manual dispatch (Actions > CI > Run workflow).
on:
  push:
    tags: ["*"]
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE*'
      - '!.gitignore'
  schedule:
    # Weekly, so upstream dependency rot (a dead submodule URL, a yanked tag)
    # surfaces within days instead of at the next push.
    - cron: "15 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 27 · build & test
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (expects macOS 27 + Xcode 27)
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          sw_vers -productVersion | grep -q '^27\.' || { echo "::error::expected a macOS 27 host (package floor is macOS 27)"; exit 1; }
          xcodebuild -version | head -1 | grep -q '^Xcode 27\.' || { echo "::error::expected Xcode 27"; exit 1; }
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test
